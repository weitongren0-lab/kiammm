<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>NOVAPAY Client</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#101b33;color:#fff;padding:18px 28px;display:flex;justify-content:space-between}nav{padding:14px;background:#fff;display:flex;gap:8px;flex-wrap:wrap}button{padding:9px 13px;border:0;border-radius:8px;background:#173b72;color:#fff;cursor:pointer}main{padding:24px;max-width:1100px;margin:auto}.card{background:#fff;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,select,textarea{padding:10px;width:100%;box-sizing:border-box;margin:5px 0}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.hidden{display:none}.chat{height:300px;overflow:auto;border:1px solid #ddd;padding:10px}</style></head><body><header><b>NOVAPAY</b><span id="who"></span></header><nav><button onclick="show('home')">首页</button><button onclick="show('orders')">订单</button><button onclick="show('assets')">资产</button><button onclick="show('support')">客服</button><button onclick="show('profile')">我的</button></nav><main id="app"></main><script>
const A='/api';let user=JSON.parse(localStorage.npUser||'null'); if(!user){user={id:1,username:'Olivia',balance:12680.42};localStorage.npUser=JSON.stringify(user)} document.getElementById('who').textContent=user.username;
async function api(p,o){let r=await fetch(A+p,{headers:{'Content-Type':'application/json'},...o});return r.json()}
async function show(p){if(p==='home'){let ps=await api('/products');app.innerHTML='<h2>商品</h2><div class="grid">'+ps.map(x=>`<div class=card><h3>${x.name}</h3><p>价格：${x.price} USDT</p><p>数量：${x.quantity}</p><button onclick="addOrder(${x.id},${x.price})">添加订单</button></div>`).join('')+'</div>'}else if(p==='orders'){let os=await api('/orders');app.innerHTML='<h2>我的订单</h2><table><tr><th>订单</th><th>类型</th><th>数量</th><th>价格</th><th>状态</th></tr>'+os.filter(x=>x.userId===user.id).map(x=>`<tr><td>${x.id}</td><td>${x.type}</td><td>${x.quantity}</td><td>${x.price}</td><td>${x.status}</td></tr>`).join('')+'</table>'}else if(p==='assets'){app.innerHTML=`<h2>资产</h2><div class=card><h3>USDT余额：${user.balance.toFixed(2)}</h3><button onclick="deposit('usdt')">USDT充值</button> <button onclick="deposit('bank')">银行卡充值（联系客服）</button><button onclick="withdraw('usdt')">USDT提现</button><button onclick="withdraw('bank')">银行卡提现</button></div>`}else if(p==='support'){let ms=await api('/messages/'+user.id);app.innerHTML='<h2>在线客服</h2><div class=chat id=chat>'+ms.map(m=>`<p><b>${m.from==='customer'?'我':'客服'}：</b>${m.text} <small>${m.read?'已读':'未读'}</small></p>`).join('')+'</div><input id=msg placeholder="输入消息"><button onclick="send()">发送</button>';await api('/messages/read/'+user.id,{method:'POST'})}else if(p==='profile'){app.innerHTML=`<h2>我的</h2><div class=card>账号：${user.username}<br>USDT：${user.balance.toFixed(2)}<br><button onclick="show('assets')">资产管理</button></div>`}}
async function addOrder(pid,price){await api('/orders',{method:'POST',body:JSON.stringify({userId:user.id,productId:pid,type:'buy',quantity:1,price})});alert('订单已添加');show('orders')}async function deposit(method){if(method==='bank'){show('support');setTimeout(()=>{msg.value='您好，我想办理银行卡充值，请客服协助。'},50);return}let a=prompt('USDT充值金额');if(a)await api('/deposits',{method:'POST',body:JSON.stringify({userId:user.id,method,amount:a})});alert('充值申请已提交')}async function withdraw(method){let a=prompt('提现金额');if(a)await api('/withdrawals',{method:'POST',body:JSON.stringify({userId:user.id,method,amount:a})});alert('提现申请已提交')}async function send(){if(!msg.value)return;await api('/messages',{method:'POST',body:JSON.stringify({userId:user.id,from:'customer',text:msg.value})});show('support')}show('home');</script></body></html>
